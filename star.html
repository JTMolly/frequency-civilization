<style>
:root{--bg:#fffdf8;--ink:#4a3a2c;--sub:#8a7560;--gold:#c9a050;--line:#ead9b8;--card:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Songti TC","Noto Serif TC",serif;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:28px;margin:8px 0 4px;letter-spacing:2px}
.small{font-size:14px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 24px rgba(201,160,80,.10)}
button{font:inherit;background:#fff;border:1px solid var(--gold);color:var(--ink);border-radius:999px;padding:10px 18px;margin:6px 6px 0 0;cursor:pointer}
button.main{background:var(--gold);color:#fff;border-color:var(--gold)}

.star{width:72px;height:72px;border-radius:50%;margin:6px auto 10px;box-shadow:0 0 40px 10px var(--glow)}
.center{text-align:center}
.bars{display:grid;grid-template-columns:72px 1fr 34px;gap:6px 10px;align-items:center;font-size:14px}
.bar{height:8px;background:#f3ead8;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .5s}
.stage{font-size:13px;color:var(--gold);letter-spacing:3px}
.event{font-size:18px;margin:6px 0 10px}
.log{font-size:14px;color:var(--sub);border-left:2px solid var(--line);padding-left:10px;margin-top:10px}
.peers div{font-size:14px;margin:6px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
a{color:var(--ink)}
.fact{font-size:14px;color:#8a6d3b;background:#fbf5e8;border-radius:12px;padding:10px 12px;margin:8px 0 6px}
.src{font-size:12px;color:var(--sub);margin-top:18px;text-align:left;line-height:1.6}
.src a{color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-top:28px;text-align:center}
.langbar{max-width:560px;margin:0 auto;padding:14px 18px 0;display:flex;justify-content:flex-end}
.langbar .lang-switch a{font-family:system-ui,sans-serif}
.fbrow{display:flex;flex-wrap:wrap;gap:0 0;margin:6px 0 2px}
button.fbtn.done{background:#fbf5e8;color:var(--sub);border-color:var(--line);cursor:default}
textarea{display:block;width:100%;font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 6px;resize:vertical}
textarea:focus{outline:none;border-color:var(--gold)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.fbmsg{font-size:13px;color:var(--sub);margin-left:4px}
.voice{font-size:14px;border-left:2px solid var(--gold);padding-left:10px;margin:10px 0;white-space:pre-wrap;word-break:break-word}

<script>

const STARS=[
 {k:'SK',n:"Sa'karan",r:'建構者',c:'#b8892b',land:'一顆由岩層和光柱組成的星球，大家用一塊一塊的石頭，把想像蓋成真的。',gift:'把混亂變成結構',

   {l:'先確認目標，讓計畫為目標服務，不重要的放掉',d:{calm:+12,gift:+10},m:'從「控制」轉為「承載」，結構變成了支撐。'},
   {l:'乾脆整個放棄',d:{gift:-10,calm:-4},m:'放掉的不只是計畫，還有一點點自己。'}]},key:'讓結構服務目標，從控制轉為承載。'},
 {k:'EL',n:"Elariah",r:'情緒引導者',c:'#e8806f',land:'一顆被溫暖海洋包住的星球，每一道漣漪都是一種心情。',gift:'讀懂別人沒說出口的感受',
  kid:'你小時候一走進客廳，就知道爸媽剛剛是不是吵過架。',

   {l:'把門關起來，誰都不見',d:{bond:-12,calm:+2},m:'安靜了，也孤單了。'}]},key:'感受可以經過你，不必留在你身上。'},
 {k:'TH',n:"Thaleon",r:'洞察轉化者',c:'#5b3fa0',land:'一顆有火焰極光的星球，什麼東西進來，都會被燒成新的樣子。',gift:'把傷變成力量',

  trial:{e:'人生又來一次大轉折。你開始想：「是不是都是我不好？」',o:[

   {l:'把這次的挫折當材料，寫下學到了什麼',d:{gift:+12,calm:+8},m:'挫折不是懲罰，是材料。這本來就是你最擅長的事。'},
   {l:'都是別人害的',d:{bond:-10,calm:-4},m:'怪別人很快，但問題還在原地。'}]},key:'挫折不是懲罰，是材料。'},
 {k:'AU',n:"Auri'kai",r:'直覺洞察者',c:'#5aa9c9',land:'一顆雲很低的星球，聲音會在拱橋之間來回，聽得到很遠的消息。',gift:'比別人早一步感覺到',
  kid:'你小時候常常比大人早一步感覺到氣氛不對，也常常需要一個人躲起來安靜一下。',
  trial:{e:'最近腦中的聲音和感覺特別多，你分不清哪些是直覺，哪些是焦慮。',o:[

   {l:'先記下來，睡一覺，隔天再看',d:{calm:+12,gift:+8},m:'從「被動接收」轉為「主動篩選」，留下來的才是真的。'},
   {l:'把感覺全部關掉，只相信道理',d:{gift:-10,calm:+2},m:'很安全，但你也聽不到自己了。'}]},key:'從被動接收，轉為主動篩選。'},
 {k:'RO',n:"Rohen'dal",r:'行動推動者',c:'#e2562b',land:'一顆風很大的星球，停下來就會被吹走，所以大家都在前進。',gift:'讓事情動起來',
  kid:'你小時候想到就做，常常第一個舉手，也常常被說太衝。',
  trial:{e:'團隊卡住了，大家還在討論。你很想一個人衝出去，把事情做完。',o:[
   {l:'不等了，自己衝',d:{gift:+6,bond:-10,body:-6},m:'事情動了，但回頭一看，大家都沒跟上。'},
   {l:'先確認方向，再全速前進',d:{gift:+10,bond:+8},m:'從「反應」轉為「回應」，你的速度帶著大家一起走。'},
   {l:'生悶氣，什麼都不做',d:{calm:-10,gift:-4},m:'火沒有熄，只是悶在裡面。'}]},key:'先確認方向，再全速前進。'},
 {k:'ZA',n:"Zae'rah",r:'穩定支持者',c:'#3fa98f',land:'一顆安靜的湖星，水面很平，連星星都看得清楚。',gift:'讓身邊的人安心',
  kid:'你小時候是家裡最安靜、最讓大人放心的那一個。',
  trial:{e:'有一件事讓你很不舒服，但你習慣說「沒關係」。',o:[

   {l:'忍到有一天突然爆發',d:{bond:-12,calm:-6},m:'湖面終於起了浪，大家都嚇了一跳。'}]},key:'穩定不是沒有感覺，是有感覺仍然站得穩。'},
 {k:'VA',n:"Valtara",r:'集體整合者',c:'#2a46b8',land:'一顆由六角形城市連成網的星球，每個節點都彼此接得上。',gift:'把大家連在一起',
  kid:'你小時候總是那個把大家揪在一起玩的人。',
  trial:{e:'每個人都希望你站在他那邊，你好想讓所有人都滿意。',o:[
   {l:'每個人都答應',d:{body:-8,calm:-10},m:'大家都滿意了，只有你越來越不知道自己要什麼。'},
   {l:'回到大家共同的目標，說出你的立場',d:{bond:+10,gift:+10},m:'從「取悅每個人」轉為「對齊共同目標」，網子反而更牢。'},
   {l:'退出所有群組',d:{bond:-14},m:'清靜了，網子卻少了一個節點。'}]},key:'不必取悅每個人，對齊共同的目標。'},
 {k:'KU',n:"Kuthari",r:'系統記錄者',c:'#7d8aa6',land:'一顆像圖書館的星球，每一陣風都會翻一頁書。',gift:'記住重要的事，看見規律',
  kid:'你小時候就有寫日記、收集東西的習慣，記得每個人的生日。',
  trial:{e:'你已經研究了三個月，筆記寫滿好幾本，但還沒開始做。',o:[
   {l:'再研究一下，等更確定',d:{gift:-10,calm:-4},m:'知識一直堆，遲遲派不上用場。'},
   {l:'先把真實發生的記下來，做一個小小的版本',d:{gift:+12,calm:+6},m:'從「分析」轉為「見證」，紀錄開始長出行動。'},
   {l:'全部丟掉，重新開始',d:{calm:-8,gift:-4},m:'書丟了，規律也跟著不見了。'}]},key:'從分析，轉為見證。'},
 {k:'ME',n:"Mei'hara",r:'關係共振者',c:'#c98a7a',land:'一顆有兩個月亮的星球，月亮總是互相照著對方。',gift:'讓關係變得溫柔',
  kid:'你小時候就是朋友們傾訴心事的對象。',
  trial:{e:'一段很深的關係裡，你給得越來越多，卻越來越不像自己。',o:[
   {l:'再多給一點，他需要我',d:{body:-8,calm:-10,bond:+2},m:'愛得很深，自己卻越來越淡。'},
   {l:'理解對方，也保有自己',d:{bond:+10,calm:+10},m:'從「情緒同步」轉為「理解對方、保有自己」，愛裡也有界線。'},
   {l:'直接切斷',d:{bond:-12,calm:-2},m:'傷口不見了，渴望連結的心也藏起來了。'}]},key:'理解對方，也保有自己。'},
 {k:'XO',n:"Xon'teh",r:'技術對接者',c:'#1f5fbf',land:'一顆滿是工坊的星球，任何兩樣東西都找得到接口。',gift:'把想法做成工具',
  kid:'你小時候喜歡把東西拆開，想知道它怎麼運作，再把它裝回去。',
  trial:{e:'你做出一個很精準的工具，但大家都說不好用。',o:[
   {l:'是他們不會用',d:{bond:-10,gift:-2},m:'工具很完美，只是沒有人想用。'},
   {l:'回去問用的人，讓工具為人服務',d:{gift:+10,bond:+10},m:'從「控制」轉為「協作」，效率也可以有溫度。'},
   {l:'再加十個功能',d:{body:-10,gift:-2},m:'越做越複雜，你也越來越累。'}]},key:'工具是為人服務的，效率也可以有溫度。'},
 {k:'NA',n:"Nael'tu",r:'領航創造者',c:'#6a62c4',land:'一顆最靠近北極星的星球，大家習慣抬頭找方向。',gift:'看見還不存在的路',
  kid:'你小時候就常常想像未來的世界，還會帶著大家玩自己發明的遊戲。',
  trial:{e:'你看得到很遠的地方，但身邊的人還跟不上。你決定什麼都自己扛。',o:[

   {l:'把方向說清楚，讓每個人記得自己的路',d:{bond:+10,gift:+8,calm:+6},m:'從「帶領」轉為「啟動」，大家開始自己走。'},
   {l:'乾脆放棄這個方向',d:{gift:-12},m:'那條還不存在的路，又回到了想像裡。'}]},key:'最好的領導，是讓每個人記得自己的方向。'},
 {k:'OR',n:"Ori'shan",r:'節奏帶動者',c:'#b5357f',land:'一顆會唱歌的星球，心跳、潮汐和腳步都在同一個節拍裡。',gift:'帶動大家的節奏',
  kid:'你小時候坐不住，一聽到音樂就會跟著動起來。',
  trial:{e:'你連續坐了好幾週，身體很僵，心情也跟著悶住了。',o:[

   {l:'去跳舞、去走路，讓身體動起來',d:{body:+12,calm:+8,gift:+4},m:'從「控制身體」轉為「傾聽身體」，節奏回來了，狀態也回來了。'},

];
const HOMES=['一個雙薪的小家庭','一個熱鬧的大家族','一個常常搬家的家庭','一個開小店的家庭','一個單親但很愛你的家','一個很重視成績的家庭'];

const clamp=v=>Math.max(0,Math.min(100,v));
// Each stage has one or two versions, picked at random; the planet trial differs per star.
const POOL=[
 [{t:'童年',e:s=>`${s.kid}有大人說這樣很好，也有大人說這樣不好。`,o:[

   {l:'偷偷繼續當自己喜歡的樣子',d:{calm:+8,gift:+6},m:'沒人看見的地方，你一直沒有放掉自己。'},

// Public data points; sources are listed on the ending page.
const FACTS={
 '童年':'研究估計，大約 15–20% 的人是高敏感的人。敏感不是弱點，是還沒被讀懂的精準度。¹',
 '第一份工作':'台灣受僱勞工一年平均工作約 2,020 小時，在 39 個主要國家裡排第 5。²',
 '關係':'台灣有伴侶的女性，每天花在家務和照顧家人的時間，平均約 4.41 小時。³',
 '累到極限':'台灣大約每 10 個人，就有 1 個長期失眠。⁴',
};
const SOURCES=[
 ['⁰ 每秒約 4 個新生兒：依聯合國《世界人口展望 2024》換算（2024 年 470 萬個寶寶的母親未滿 18 歲，占全球約 3.5%，全年約 1.3 億個新生兒）','https://desapublications.un.org/publications/world-population-prospects-2024-summary-results'],
 ['¹ 高敏感約占 15–20%：Aron & Aron（1997）高敏感量表研究，維基百科整理','https://en.wikipedia.org/wiki/Sensory_processing_sensitivity'],
 ['² 年總工時 2,020 小時、39 國第 5：勞動部國際比較（2023 年資料）','https://blog.104.com.tw/taiwan-2023-total-working-hours-2020-hours/'],
 ['³ 每天無酬照顧 4.41 小時：衛福部 113 年女性生活狀況調查','https://www.thenewslens.com/article/263200'],
 ['⁴ 慢性失眠盛行率約 11.3%（約每 10 人 1 人）：台灣睡眠醫學會國人睡眠調查，康健雜誌 2017/3/24 報導','https://www.commonhealth.com.tw/article/74559'],
];
function buildStages(s){return POOL.map(p=>p==='TRIAL'?{t:'星球試煉',e:()=>s.trial.e,o:s.trial.o}:rnd(p));}
function ending(st){
  const {body,calm,bond,gift}=st;
  if(gift>=70&&body>=55&&calm>=55) return ['穩穩發光的人','你把天賦活出來，也沒有把自己燒掉。','glow'];
  if(gift>=70&&body<45) return ['燒得太快的人','你的光很亮，但肉身一直在替你付帳。','burn'];
  if(bond>=70&&gift<55) return ['照亮別人的人','你照顧了很多人，下一趟，記得也照顧自己。','light'];
  if(calm>=70) return ['安靜扎根的人','你很穩，身邊的人都因為你而安心。','root'];
  if(gift<40) return ['把天賦藏起來的人','那顆星的光還在，只是一直沒被拿出來用。','hide'];
  return ['還在路上的人','你一邊摸索、一邊前進，這也是一種勇敢。','road'];
}
let S={};
// Feedback and player voices: anonymous; only a button choice and an optional message are stored; messages show only after approval.
const SB_URL='https://ssqozzkhkqxdbqmqamee.supabase.co',SB_KEY='sb_publishable_3QsVK0QyO9SWOPTo84QZzQ_EDVaNagP';
const FB_LOCAL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const FB_CHOICES={more_stars:'想要更多星球',more_levels:'想要更多關卡',share_card:'想要分享卡',other:'其他'};
function fbState(){try{return JSON.parse(localStorage.getItem('fc_star_fb')||'{}');}catch(e){return {};}}
function fbSave(st){try{localStorage.setItem('fc_star_fb',JSON.stringify(st));}catch(e){}}
function fbPost(row){
  if(FB_LOCAL){console.info('[本機預覽] 不寫入 star_feedback',row);return Promise.resolve({ok:true,status:201});}
  return fetch(SB_URL+'/rest/v1/star_feedback',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(row)});
}
function fbVote(c,btn){
  const st=fbState(); st.votes=st.votes||{};
  if(st.votes[c]){return;}
  btn.disabled=true;
  fbPost({choice:c}).then(r=>{
    if(r.ok||r.status===409){st.votes[c]=Date.now();fbSave(st);btn.classList.add('done');btn.textContent='✓ '+FB_CHOICES[c];}
    else{btn.disabled=false;document.getElementById('fbstatus').textContent='暫時送不出去，晚點再試一次。';}
  }).catch(()=>{btn.disabled=false;document.getElementById('fbstatus').textContent='網路好像不太穩，晚點再試一次。';});
}
function fbSend(){
  const box=document.getElementById('fbmsg'),out=document.getElementById('fbstatus'),btn=document.getElementById('fbsend');
  if(document.getElementById('fbhp').value){out.textContent='謝謝你，我們收到了。';return;}
  const msg=box.value.trim();
  if(!msg){out.textContent='還沒有寫內容喔。';return;}
  if([...msg].length>200){out.textContent='請控制在 200 字以內。';return;}
  if(/[\w.+-]+@[\w-]+\.[\w.]+|https?:\/\/|www\.|\+?\d[\d\s-]{7,}/i.test(msg)){out.textContent='看起來有聯絡方式或網址，請拿掉再送出。';return;}
  const st=fbState(); const now=Date.now(); st.msgs=(st.msgs||[]).filter(t=>now-t<864e5);
  if(st.msgs.length>=3){out.textContent='今天已經收到你的留言了，明天再來寫吧。';return;}
  if(st.msgs.length&&now-st.msgs[st.msgs.length-1]<20000){out.textContent='慢慢來，過一下再送出。';return;}
  btn.disabled=true;out.textContent='送出中…';
  fbPost({choice:'other',message:msg}).then(r=>{
    if(r.ok||r.status===409){st.msgs.push(now);fbSave(st);box.value='';out.textContent='收到了，謝謝你。留言經審核後才會公開。';}
    else{out.textContent='暫時送不出去，晚點再試一次。';}
    btn.disabled=false;
  }).catch(()=>{out.textContent='網路好像不太穩，晚點再試一次。';btn.disabled=false;});
}
function loadVoices(){
  fetch(SB_URL+'/rest/v1/star_feedback?select=message&approved=eq.true&message=not.is.null&order=created_at.desc&limit=5',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
    .then(r=>r.ok?r.json():[]).then(rows=>{
      const isEn=PAGE_LANG==='en';rows=(rows||[]).filter(r=>/[\u3400-\u9fff]/.test(r.message)!==isEn);
      const box=document.getElementById('voices'); if(!box||!rows||!rows.length)return;
      const h=document.createElement('b'); h.textContent='玩家說'; box.appendChild(h);
      rows.forEach(r=>{const d=document.createElement('div');d.className='voice';d.textContent=r.message;box.appendChild(d);});
      box.className='card';
    }).catch(()=>{});
}
const PAGE_LANG=document.documentElement.lang||'zh-Hant';
function ev(name,params){try{if(window.gtag)gtag('event',name,Object.assign({transport_type:'beacon',lang:PAGE_LANG},params||{}));}catch(e){}}
function start(){
  const star=rnd(STARS); const home=rnd(HOMES);
  S={star,home,i:0,stages:buildStages(star),stat:{body:60+Math.floor(Math.random()*15),calm:45+Math.floor(Math.random()*15),bond:45+Math.floor(Math.random()*15),gift:45+Math.floor(Math.random()*15)},log:[]};
  S.peers=[0,1,2,3].map(()=>({home:rnd(HOMES),stat:{...S.stat}}));
  ev('game_start');
  render();
}
function choose(k){
  const st=S.stages[S.i]; const o=st.o[k];
  for(const [a,v] of Object.entries(o.d)) S.stat[a]=clamp(S.stat[a]+v);
  S.log.push(`${st.t}：${o.l}。${o.m}`);
  // The four others born in the same second choose at random.
  S.peers.forEach(p=>{const q=rnd(st.o); for(const [a,v] of Object.entries(q.d)) p.stat[a]=clamp(p.stat[a]+v);});
  S.i++;
  if(S.i===S.stages.length) ev('game_end',{star:S.star.k,ending:ending(S.stat)[2]});
  render(o.m);
}
function bars(stat){return '<div class="bars">'+Object.entries(STAT_NAMES).map(([k,n])=>`<span>${n}</span><span class="bar"><i style="width:${stat[k]}%"></i></span><span>${stat[k]}</span>`).join('')+'</div>';}
function render(msg){
  const app=document.getElementById('app');
  if(!S.star){
    app.innerHTML=`<div class="center"><div class="small">頻率文明｜小遊戲</div><h1>這一趟，從哪顆星出發</h1>
    <p>地球上有 80 億人。<br>想像每個人出發之前，都來自某一顆星。</p>
    <p class="small">全世界平均每一秒，大約有 4 個寶寶出生。⁰<br>所以這一趟，你會看到和你同一秒出發的另外 4 個人。</p>
    <p class="small">你不能選擇從哪顆星出發，也不能選擇出生在什麼家庭。<br>但到了地球之後，每一步，都由你自己選。</p>
    <button class="main" onclick="start()">出發</button></div>
    <p class="note">這是想像力遊戲，12 顆星是 12 種天賦的比喻，不是測驗，也不是預言。</p>`;
    return;
  }
  const s=S.star;
  if(S.i<S.stages.length){
    const st=S.stages[S.i];
    app.innerHTML=`<div class="card center" style="--glow:${s.c}55"><div class="star" style="background:radial-gradient(circle at 35% 35%,#fff,${s.c})"></div>
      <div><b>${s.n}</b>　${s.r}</div><div class="small">${S.i===0?s.land+'<br>你在地球的起點：'+S.home+'。':'天賦：'+s.gift}</div></div>
      <div class="card"><div class="stage">${st.t}｜${S.i+1}／${S.stages.length}</div><div class="event">${st.e(s)}</div>${FACTS[st.t]?`<div class="fact">你知道嗎？${FACTS[st.t]}</div>`:''}
      ${st.o.map((o,k)=>`<button onclick="choose(${k})">${o.l}</button>`).join('')}
      ${msg?`<div class="log">${msg}</div>`:''}</div>
      <div class="card">${bars(S.stat)}</div>`;
    return;
  }
  const [title,line]=ending(S.stat);
  app.innerHTML=`<div class="card center" style="--glow:${s.c}66"><div class="small">這一趟走完了</div>
    <div class="star" style="background:radial-gradient(circle at 35% 35%,#fff,${s.c})"></div>
    <h1>${title}</h1><p>你從 <b>${s.n}</b>（${s.r}）出發。<br>${line}</p>${bars(S.stat)}<p class="small">${s.n} 的提醒：${s.key}</p></div>
    <div class="card"><b>同一秒，從同一顆星出發的另外四個人</b><div class="peers">
    ${S.peers.map((p,i)=>{const [t]=ending(p.stat);return `<div><span class="dot" style="background:${s.c}"></span>第 ${i+1} 位，出生在${p.home}：${t}</div>`}).join('')}
    </div><p class="small">一樣的星，一樣的天賦，不一樣的選擇。</p></div>
    <div class="card"><b>你這一趟的選擇</b>${S.log.map(l=>`<div class="log">${l}</div>`).join('')}</div>
    <div class="card center"><p>所有訊息都可以是參考，<br>但你人生的決定權，在你自己身上。</p>
    <button onclick="S={};render()">再投生一次</button>
    <a href="tests.html" target="_blank" rel="noopener" onclick="ev('click_test')"><button class="main">想認識真正的你？做語根測驗</button></a></div>
    <div class="card" id="fb"><b>你想在這個遊戲裡看到什麼？</b>
      <div class="fbrow">${Object.entries(FB_CHOICES).map(([k,t])=>`<button class="fbtn${(fbState().votes||{})[k]?' done':''}" ${(fbState().votes||{})[k]?'disabled':''} onclick="fbVote('${k}',this)">${(fbState().votes||{})[k]?'✓ ':''}${t}</button>`).join('')}</div>
      <textarea id="fbmsg" rows="3" maxlength="200" placeholder="想對我們說什麼？（選填，200 字內）"></textarea>
      <input id="fbhp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" placeholder="請勿填寫">
      <div class="small">請不要留下姓名、電話等個人資料；留言經審核後才會公開。</div>
      <button id="fbsend" onclick="fbSend()">送出留言</button><span id="fbstatus" class="fbmsg"></span></div>
    <div id="voices"></div>
    <div class="src"><b>數據出處</b>${SOURCES.map(([t,u])=>`<div><a href="${u}" target="_blank" rel="noopener">${t}</a></div>`).join('')}</div>`;
  loadVoices();
}
render();
</script>
