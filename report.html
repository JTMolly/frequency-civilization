<head>

<title>個人原型報告書｜頻率文明 Frequency Civilization</title>

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:title" content="個人原型報告書｜頻率文明 Frequency Civilization">
<meta property="og:description" content="整合語根、內在原型與內在動力三個測驗結果，完整呈現一個人的運作模式。">

<style>
:root{
  --bg:#08090d; --bg2:#0d0f16; --card:#12141c;
  --gold:#c9a86a; --gold-soft:#e0c894;
  --text:#e8e6e1; --muted:#9b9890; --line:rgba(201,168,106,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-weight:300;line-height:1.85;letter-spacing:.06em}
h1,h2,h3{font-family:'Noto Serif TC',serif;font-weight:500;letter-spacing:.12em}
a{color:var(--gold);text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 22px}
nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(13,15,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1040px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Noto Serif TC',serif;font-size:16px;letter-spacing:.16em;color:var(--gold-soft)}
.nav-in a.back{font-size:14px;color:var(--text);opacity:.85}
main{padding:120px 0 90px;min-height:100vh}
.btn{display:inline-block;padding:12px 34px;border:1px solid var(--gold);color:var(--gold-soft);font-size:15px;letter-spacing:.15em;border-radius:2px;background:none;cursor:pointer;transition:.25s;font-family:inherit}
.btn:hover{background:var(--gold);color:#0d0f14}
.btn.solid{background:var(--gold);color:#12131a;font-weight:500}
.kicker{color:var(--gold);font-size:13px;letter-spacing:.35em;margin-bottom:12px}
h1{font-size:clamp(26px,4.6vw,38px);margin-bottom:10px}
.meta-line{color:var(--muted);font-size:14px;margin-bottom:34px}
.name-row{display:flex;gap:14px;align-items:center;margin-bottom:36px;flex-wrap:wrap}
.name-row input{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:11px 16px;font-family:inherit;font-size:15px;letter-spacing:.05em;min-width:220px}
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:40px}
.st{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:18px 20px;font-size:14.5px}
.st .ok{color:var(--gold-soft)}
.st .missing{color:#c98a7e}
.st a{font-size:13.5px}
.core{border:1px solid var(--gold);background:var(--bg2);border-radius:8px;padding:30px 34px;margin-bottom:44px}
.core .one{font-family:'Noto Serif TC',serif;font-size:clamp(18px,2.8vw,22px);color:var(--gold-soft);line-height:2}
.sec{margin-bottom:40px}
.sec h2{font-size:21px;margin-bottom:6px}
.sec .sub{color:var(--gold);font-size:13px;letter-spacing:.2em;margin-bottom:16px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:22px 26px;margin-bottom:14px}
.card h3{font-size:16.5px;color:var(--gold-soft);margin-bottom:8px}
.card p{font-size:14.5px;color:var(--muted)}
.card b{color:var(--text);font-weight:500}
.oneliner{border-left:3px solid var(--gold);background:var(--bg2);padding:14px 22px;font-family:'Noto Serif TC',serif;font-size:16px;color:var(--gold-soft);margin-top:10px}
.notes{border:1px dashed rgba(255,255,255,.2);border-radius:6px;padding:22px 26px}
.notes .nline{border-bottom:1px solid rgba(255,255,255,.12);height:36px}
.actions{display:flex;gap:16px;margin:44px 0 10px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--muted);opacity:.75;margin-top:14px}
.hidden{display:none}
@media print{
  body{background:#fff;color:#1a1a1a}
  :root{--bg:#fff;--bg2:#f7f4ee;--card:#faf8f4;--text:#1a1a1a;--muted:#444;--gold:#8a6d3b;--gold-soft:#6b5122;--line:#ccc}
  nav,.actions,.name-row button,.status a,.note-screen{display:none !important}
  main{padding:20px 0}
  .card,.core,.notes,.st{border-color:#ccc}
}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JELLSF706B"></script>

</head>
<body>

<nav><div class="nav-in">
  <a class="logo" href="index.html" style="color:var(--gold-soft)">頻率文明 FREQUENCY CIVILIZATION</a>
  <a class="back" href="tests.html">← 回三大測驗</a>
</div></nav>

<main><div class="wrap">
  <div class="kicker">PERSONAL ARCHETYPE REPORT</div>
  <h1>個人原型報告書</h1>
  <div class="meta-line" id="dateLine"></div>

  <div class="name-row">
    <input id="pname" placeholder="姓名（列印前可填）" oninput="renderCore()">
    <button class="btn" onclick="window.print()">列印 / 存成 PDF</button>
  </div>

  <div class="status" id="status"></div>

  <div class="core" id="core"></div>

  <div id="secRoot" class="sec"></div>
  <div id="secArch" class="sec"></div>
  <div id="secDrive" class="sec"></div>

  <div class="sec">
    <h2>一對一筆記</h2>
    <div class="sub">SESSION NOTES</div>
    <div class="notes">
      <div class="nline"></div><div class="nline"></div><div class="nline"></div>
      <div class="nline"></div><div class="nline"></div><div class="nline"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn solid" onclick="window.print()">列印 / 存成 PDF</button>
    <button class="btn" onclick="location.reload()">重新讀取結果</button>
  </div>
  <p class="note note-screen">報告資料來自你在這個瀏覽器完成的測驗結果，只存在你自己的裝置上，我們不會收到。<br>本報告為教育與自我認知工具，不具醫療或心理診斷性質。</p>
</div></main>

<script>
const ROOTS = {
 "Sa'karan":{name:"建構者",desc:"擅長把混亂整理成結構，先建立框架、流程與優先順序，讓事情可以執行。"},
 "Elariah":{name:"情緒引導者",desc:"對他人情緒高度敏銳，能接住還沒說出口的感受，讓人敢說真話。"},
 "Thaleon":{name:"洞察轉化者",desc:"看穿表層說法、指出盲點，一句話能讓人重新看待自己的處境。"},
 "Auri'kai":{name:"直覺洞察者",desc:"感知先於語言，安靜時常有畫面與洞見浮現，擅長察覺未被說出的訊息。"},
 "Rohen'dal":{name:"行動推動者",desc:"想法一出現就動手，用行動帶動節奏，讓停滯的事情重新運轉。"},
 "Zae'rah":{name:"穩定支持者",desc:"在混亂中保持穩定的存在，你在場，大家就安心。"},
 "Valtara":{name:"集體整合者",desc:"看見每個人的位置與特質，讓不同的人在同一個節奏裡合作。"},
 "Kuthari":{name:"系統記錄者",desc:"整理、記錄與轉譯，把複雜經驗寫成可複製、可理解的知識。"},
 "Mei'hara":{name:"關係共振者",desc:"一對一感應力極強，能快速讀懂對方真正的需求與未說出口的感受。"},
 "Xon'teh":{name:"技術對接者",desc:"把不同工具、系統與方法接起來，找到串接點讓事情流動。"},
 "Nael'tu":{name:"領航創造者",desc:"自然描繪方向與願景，讓人看見「原來還有這條路」。"},
 "Ori'shan":{name:"節奏帶動者",desc:"用聲音、節奏與行動改變現場氛圍，一動全場就活起來。"}
};
const ARCH = {
 "行動者":{en:"The Initiator",sub:"推進 × 突破",way:"第一個開始、打通堵塞",line:"你不是只會做事的人，你是能讓任務有生命的人。"},
 "療癒者":{en:"The Holder",sub:"承接 × 安定",way:"安定現場、承接情緒",line:"你的溫柔不是要你無聲地承受，而是讓別人因你而記得自己。"},
 "教導者":{en:"The Architect",sub:"結構 × 轉譯",way:"建立秩序、把抽象變清楚",line:"你不是來證明你懂很多，而是來讓知識變成別人走得過去的橋。"},
 "感應者":{en:"The Channeler",sub:"接收 × 導航",way:"接收細微訊號、由內在導航",line:"你是來把還沒有語言的訊號，轉成大家能用的語言。"},
 "洞見者":{en:"The Seer",sub:"穿透 × 識破",way:"看穿表象、直指核心",line:"守住你的視野，等對的人靠近。"},
 "鏡面者":{en:"The Reflector",sub:"映照 × 轉化",way:"映照他人、觸發覺察",line:"先照見自己，才能穩定別人。"}
};
const DRIVE = {
 "療癒":{sub:"修復 × 陪伴",motive:"讓破碎回到完整、讓混亂回到安定",line:"我可以陪你走一段，但我不替你走你的人生。"},
 "探索":{sub:"未知 × 開拓",motive:"尋找可能性、打開新路",line:"我不是要一次找對路，我要建立「找路的能力」。"},
 "服務":{sub:"支持 × 集體",motive:"讓整體變得更好",line:"我服務集體，但我不把自己當成耗材。"},
 "守護":{sub:"穩定 × 邊界",motive:"守住秩序與安全",line:"我守護底線，不替所有人擔責。"},
 "突破":{sub:"進化 × 推動",motive:"打破限制、推動進化",line:"我推動改變，但我不替不願改的人燃燒。"},
 "創造":{sub:"開創 × 孕育",motive:"把還不存在的東西變成現實",line:"給我空間，我就會長出答案。"},
 "傳遞":{sub:"橋接 × 表達",motive:"讓訊息被真正理解",line:"我負責把話講清楚，不負責逼人接受。"},
 "共鳴":{sub:"連結 × 放大",motive:"讓人與人合拍、形成更大的協作",line:"我能帶動全場，但我不把自己交給全場。"}
};

function get(key){ try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; } }
/* 預覽模式：report.html?demo=1 用範例資料展示完整報告長相 */
const DEMO = new URLSearchParams(location.search).has('demo');
const R = DEMO ? {top:"Auri'kai", sec:"Mei'hara"} : get('fc_result_root');
const A = DEMO ? {top:"感應者", sec:"鏡面者", mix:false} : get('fc_result_archetype');
const D = DEMO ? {top:"創造", sec:"傳遞", low:"守護"} : get('fc_result_drive');

document.getElementById('dateLine').textContent = '產生日期：' + new Date().toLocaleDateString('zh-TW') + '・頻率文明 12 語根系統';

const status = document.getElementById('status');
status.innerHTML = [
  R ? `<div class="st"><span class="ok">✓ 語根測驗</span>　主語根：${R.top}</div>`
    : `<div class="st"><span class="missing">○ 語根測驗未完成</span>　<a href="test.html">去測驗 →</a></div>`,
  A ? `<div class="st"><span class="ok">✓ 內在原型測驗</span>　原型：${A.top}${A.mix?` × ${A.sec}`:''}</div>`
    : `<div class="st"><span class="missing">○ 內在原型測驗未完成</span>　<a href="test-archetype.html">去測驗 →</a></div>`,
  D ? `<div class="st"><span class="ok">✓ 內在動力測驗</span>　主動力：${D.top}型</div>`
    : `<div class="st"><span class="missing">○ 內在動力測驗未完成</span>　<a href="test-drive.html">去測驗 →</a></div>`
].join('');

function renderCore(){
  const core = document.getElementById('core');
  const name = document.getElementById('pname').value.trim();
  const who = name ? `${name}` : '這個人';
  if(R && A && D){
    core.innerHTML = `<div class="kicker">核心定位</div>
      <div class="one">${who}以「${R.top}・${ROOTS[R.top].name}」的方式運作，<br>
      在人群中自然成為「${A.top}・${ARCH[A.top].en}」，<br>
      由「${D.top}型動力」推動——${DRIVE[D.top].motive}。</div>
      <p style="margin-top:16px;font-size:14.5px;color:var(--muted)">一句話整合：${who}是以<b style="color:var(--gold-soft)">${ROOTS[R.top].name}的方式</b>，以<b style="color:var(--gold-soft)">${ARCH[A.top].way}的角色</b>，去完成<b style="color:var(--gold-soft)">「${DRIVE[D.top].motive}」</b>這個內在動機。</p>`;
  } else {
    const done = [R,A,D].filter(Boolean).length;
    core.innerHTML = `<div class="kicker">核心定位</div>
      <p style="color:var(--muted);font-size:15px">已完成 ${done} / 3 個測驗。三個測驗都完成後，這裡會自動產生整合的核心定位——語根（怎麼運作）× 原型（在人群中的角色）× 動力（為什麼而動）。</p>`;
  }
}
renderCore();

if(R){
  document.getElementById('secRoot').innerHTML = `
    <h2>語根｜你怎麼運作</h2><div class="sub">ROOT CODE・HOW YOU OPERATE</div>
    <div class="card"><h3>主語根：${R.top}・${ROOTS[R.top].name}</h3><p>${ROOTS[R.top].desc}</p></div>
    <div class="card"><h3>副語根：${R.sec}・${ROOTS[R.sec].name}</h3><p>${ROOTS[R.sec].desc}</p><p style="margin-top:8px">主語根是最自然的啟動方式，副語根是第二種運作模式，兩者組合構成完整的運作風格。</p></div>`;
} else document.getElementById('secRoot').classList.add('hidden');

if(A){
  document.getElementById('secArch').innerHTML = `
    <h2>內在原型｜你在人群中的角色</h2><div class="sub">INNER ARCHETYPE・HOW YOU SHOW UP</div>
    <div class="card"><h3>${A.top}・${ARCH[A.top].en}（${ARCH[A.top].sub}）${A.mix?`　×　${A.sec}・${ARCH[A.sec].en}`:''}</h3>
    <p>在人群中的自然角色：${ARCH[A.top].way}${A.mix?`；混合 ${ARCH[A.sec].way}`:''}。</p>
    <div class="oneliner">${ARCH[A.top].line}</div></div>`;
} else document.getElementById('secArch').classList.add('hidden');

if(D){
  document.getElementById('secDrive').innerHTML = `
    <h2>內在動力｜你為什麼而動</h2><div class="sub">INNER DRIVE・WHY YOU MOVE</div>
    <div class="card"><h3>主動力：${D.top}型（${DRIVE[D.top].sub}）</h3><p>核心動機：${DRIVE[D.top].motive}。</p><div class="oneliner">${DRIVE[D.top].line}</div></div>
    <div class="card"><h3>副動力：${D.sec}型</h3><p>${DRIVE[D.sec].sub}——特定情境中會被啟動的輔助動力。</p></div>
    <div class="card"><h3>耗損警示：${D.low}型</h3><p>這是分數最低的動力模式。長期被要求以此模式運作，容易疲憊或空耗——安排位置時要避開。</p></div>`;
} else document.getElementById('secDrive').classList.add('hidden');
</script>
</body>
</html>
