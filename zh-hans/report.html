:root{

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-weight:300;line-height:1.85;letter-spacing:.06em}

.btn{display:inline-block;padding:12px 34px;border:1px solid var(--gold);color:var(--gold-soft);font-size:15px;letter-spacing:.15em;border-radius:2px;background:none;cursor:pointer;transition:.25s;font-family:inherit}
.btn:hover{background:var(--gold);color:#0d0f14}

.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:40px}
.st{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:18px 20px;font-size:14.5px}
.st .ok{color:var(--gold-soft)}
.st .missing{color:#c98a7e}
.st a{font-size:13.5px}
.core{border:1px solid var(--gold);background:var(--bg2);border-radius:8px;padding:30px 34px;margin-bottom:44px}
.core .one{font-family:'Noto Serif TC',serif;font-size:clamp(18px,2.8vw,22px);color:var(--gold-soft);line-height:2}
.sec{margin-bottom:40px}
.sec h2{font-size:21px;margin-bottom:6px}
.sec .sub{color:var(--gold);font-size:13px;letter-spacing:.2em;margin-bottom:16px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:22px 26px;margin-bottom:14px}
.card h3{font-size:16.5px;color:var(--gold-soft);margin-bottom:8px}
.rlink{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.rlink:hover{color:var(--gold)}
.card p{font-size:14.5px;color:var(--muted)}
.card b{color:var(--text);font-weight:500}
.oneliner{border-left:3px solid var(--gold);background:var(--bg2);padding:14px 22px;font-family:'Noto Serif TC',serif;font-size:16px;color:var(--gold-soft);margin-top:10px}
.notes{border:1px dashed rgba(255,255,255,.2);border-radius:6px;padding:22px 26px}
.notes .nline{border-bottom:1px solid rgba(255,255,255,.12);height:36px}
.actions{display:flex;gap:16px;margin:44px 0 10px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--muted);opacity:.75;margin-top:14px}
.hidden{display:none}
@media print{
  body{background:#fff;color:#1a1a1a}
  :root{--bg:#fff;--bg2:#f7f4ee;--card:#faf8f4;--text:#1a1a1a;--muted:#444;--gold:#8a6d3b;--gold-soft:#6b5122;--line:#ccc}
  nav,.actions,.name-row button,.status a,.note-screen{display:none !important}
  main{padding:20px 0}
  .card,.core,.notes,.st{border-color:#ccc}
}

<script>
const ROOTS = {
 "Sa'karan":{name:"建构者",desc:"擅长把混乱整理成结构，先建立框架、流程与优先顺序，让事情可以执行。"},
 "Elariah":{name:"情绪引导者",desc:"对他人情绪高度敏锐，能接住还没说出口的感受，让人敢说真话。"},
 "Thaleon":{name:"洞察转化者",desc:"看穿表层说法、指出盲点，一句话能让人重新看待自己的处境。"},
 "Auri'kai":{name:"直觉洞察者",desc:"感知先于语言，安静时常有画面与洞见浮现，擅长察觉未被说出的讯息。"},
 "Rohen'dal":{name:"行动推动者",desc:"想法一出现就动手，用行动带动节奏，让停滞的事情重新运转。"},
 "Zae'rah":{name:"稳定支持者",desc:"在混乱中保持稳定的存在，你在场，大家就安心。"},
 "Valtara":{name:"集体整合者",desc:"看见每个人的位置与特质，让不同的人在同一个节奏里合作。"},
 "Kuthari":{name:"系统记录者",desc:"整理、记录与转译，把复杂经验写成可复制、可理解的知识。"},
 "Mei'hara":{name:"关系共振者",desc:"一对一感应力极强，能快速读懂对方真正的需求与未说出口的感受。"},
 "Xon'teh":{name:"技术对接者",desc:"把不同工具、系统与方法接起来，找到串接点让事情流动。"},
 "Nael'tu":{name:"领航创造者",desc:"自然描绘方向与愿景，让人看见「原来还有这条路」。"},
 "Ori'shan":{name:"节奏带动者",desc:"用声音、节奏与行动改变现场氛围，一动全场就活起来。"}
};
const ARCH = {
 "行动者":{en:"The Initiator",sub:"推进 × 突破",way:"第一个开始、打通堵塞",line:"你不是只会做事的人，你是能让任务有生命的人。"},
 "疗愈者":{en:"The Holder",sub:"承接 × 安定",way:"安定现场、承接情绪",line:"你的温柔不是要你无声地承受，而是让别人因你而记得自己。"},
 "教导者":{en:"The Teacher",sub:"结构 × 转译",way:"建立秩序、把抽象变清楚",line:"你不是来证明你懂很多，而是来让知识变成别人走得过去的桥。"},
 "感应者":{en:"The Sensor",sub:"接收 × 导航",way:"接收细微讯号、由内在导航",line:"你是来把还没有语言的讯号，转成大家能用的语言。"},
 "洞见者":{en:"The Seer",sub:"穿透 × 识破",way:"看穿表象、直指核心",line:"守住你的视野，等对的人靠近。"},
 "镜面者":{en:"The Reflector",sub:"映照 × 转化",way:"映照他人、触发觉察",line:"先照见自己，才能稳定别人。"}
};
const DRIVE = {
 "疗愈":{sub:"修复 × 陪伴",motive:"让破碎回到完整、让混乱回到安定",line:"我可以陪你走一段，但我不替你走你的人生。"},
 "探索":{sub:"未知 × 开拓",motive:"寻找可能性、打开新路",line:"我不是要一次找对路，我要建立「找路的能力」。"},
 "服务":{sub:"支持 × 集体",motive:"让整体变得更好",line:"我服务集体，但我不把自己当成耗材。"},
 "守护":{sub:"稳定 × 边界",motive:"守住秩序与安全",line:"我守护底线，不替所有人担责。"},
 "突破":{sub:"进化 × 推动",motive:"打破限制、推动进化",line:"我推动改变，但我不替不愿改的人燃烧。"},
 "创造":{sub:"开创 × 孕育",motive:"把还不存在的东西变成现实",line:"给我空间，我就会长出答案。"},
 "传递":{sub:"桥接 × 表达",motive:"让讯息被真正理解",line:"我负责把话讲清楚，不负责逼人接受。"},
 "共鸣":{sub:"连结 × 放大",motive:"让人与人合拍、形成更大的协作",line:"我能带动全场，但我不把自己交给全场。"}
};

/* 语根名称连到该语根的介绍页 */
const ROOT_SLUG = {"Sa'karan":"sakaran","Elariah":"elariah","Thaleon":"thaleon","Auri'kai":"aurikai","Rohen'dal":"rohendal","Zae'rah":"zaerah","Valtara":"valtara","Kuthari":"kuthari","Mei'hara":"meihara","Xon'teh":"xonteh","Nael'tu":"naeltu","Ori'shan":"orishan"};
function rootA(k, label){ const s = ROOT_SLUG[k], t = label || k; return s ? `<a class="rlink" href="roots/${s}.html">${t}</a>` : t; }

function get(key){ try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; } }
/* 预览模式：report.html?demo=1 用范例资料展示完整报告长相 */
const DEMO = new URLSearchParams(location.search).has('demo');
const R = DEMO ? {top:"Auri'kai", sec:"Mei'hara"} : get('fc_result_root');
const A = DEMO ? {top:"感应者", sec:"镜面者", mix:false} : get('fc_result_archetype');
const D = DEMO ? {top:"创造", sec:"传递", low:"守护"} : get('fc_result_drive');

document.getElementById('dateLine').textContent = '产生日期：' + new Date().toLocaleDateString('zh-TW') + '・频率文明 12 语根系统';

const status = document.getElementById('status');
status.innerHTML = [
  R ? `<div class="st"><span class="ok">✓ 语根测验</span>　主语根：${rootA(R.top)}</div>`
    : `<div class="st"><span class="missing">○ 语根测验未完成</span>　<a href="test.html">去测验 →</a></div>`,
  A ? `<div class="st"><span class="ok">✓ 内在原型测验</span>　原型：${A.top}${A.mix?` × ${A.sec}`:''}</div>`
    : `<div class="st"><span class="missing">○ 内在原型测验未完成</span>　<a href="test-archetype.html">去测验 →</a></div>`,
  D ? `<div class="st"><span class="ok">✓ 内在动力测验</span>　主动力：${D.top}型</div>`
    : `<div class="st"><span class="missing">○ 内在动力测验未完成</span>　<a href="test-drive.html">去测验 →</a></div>`
].join('');

function renderCore(){
  const core = document.getElementById('core');
  const name = document.getElementById('pname').value.trim();
  const who = name ? `${name}` : '这个人';
  if(R && A && D){
    core.innerHTML = `<div class="kicker">核心定位</div>
      <div class="one">${who}以「${R.top}・${ROOTS[R.top].name}」的方式运作，<br>
      在人群中自然成为「${A.top}・${ARCH[A.top].en}」，<br>
      由「${D.top}型动力」推动——${DRIVE[D.top].motive}。</div>
      <p style="margin-top:16px;font-size:14.5px;color:var(--muted)">一句话整合：${who}是以<b style="color:var(--gold-soft)">${ROOTS[R.top].name}的方式</b>，以<b style="color:var(--gold-soft)">${ARCH[A.top].way}的角色</b>，去完成<b style="color:var(--gold-soft)">「${DRIVE[D.top].motive}」</b>这个内在动机。</p>`;
  } else {
    const done = [R,A,D].filter(Boolean).length;
    core.innerHTML = `<div class="kicker">核心定位</div>
      <p style="color:var(--muted);font-size:15px">已完成 ${done} / 3 个测验。三个测验都完成后，这里会自动产生整合的核心定位——语根（怎么运作）× 原型（在人群中的角色）× 动力（为什么而动）。</p>`;
  }
}
renderCore();

function phraseCard(r){
  if(!r || !r.phrase || !window.FC_PHRASES || !FC_PHRASES[r.top]) return '';
  const p = FC_PHRASES[r.top].find(x=>x[0]===r.phrase);
  return p ? `<div class="card"><h3>频率任务语</h3><p style="font-size:16px;color:var(--gold-soft)">「${p[1]}」</p><p style="margin-top:6px">${p[0]}・144 句里属于你的那一句</p></div>` : '';
}
if(R){
  document.getElementById('secRoot').innerHTML = `
    <h2>语根｜你怎么运作</h2><div class="sub">ROOT CODE・HOW YOU OPERATE</div>
    <div class="card"><h3>主语根：${rootA(R.top, R.top + '・' + ROOTS[R.top].name)}</h3><p>${ROOTS[R.top].desc}</p></div>
    ${phraseCard(R)}
    <div class="card"><h3>副语根：${rootA(R.sec, R.sec + '・' + ROOTS[R.sec].name)}</h3><p>${ROOTS[R.sec].desc}</p><p style="margin-top:8px">主语根是最自然的启动方式，副语根是第二种运作模式，两者组合构成完整的运作风格。</p></div>`;
} else document.getElementById('secRoot').classList.add('hidden');

if(A){
  document.getElementById('secArch').innerHTML = `
    <h2>内在原型｜你在人群中的角色</h2><div class="sub">INNER ARCHETYPE・HOW YOU SHOW UP</div>
    <div class="card"><h3>${A.top}・${ARCH[A.top].en}（${ARCH[A.top].sub}）${A.mix?`　×　${A.sec}・${ARCH[A.sec].en}`:''}</h3>
    <p>在人群中的自然角色：${ARCH[A.top].way}${A.mix?`；混合 ${ARCH[A.sec].way}`:''}。</p>
    <div class="oneliner">${ARCH[A.top].line}</div></div>`;
} else document.getElementById('secArch').classList.add('hidden');

if(D){
  document.getElementById('secDrive').innerHTML = `
    <h2>内在动力｜你为什么而动</h2><div class="sub">INNER DRIVE・WHY YOU MOVE</div>
    <div class="card"><h3>主动力：${D.top}型（${DRIVE[D.top].sub}）</h3><p>核心动机：${DRIVE[D.top].motive}。</p><div class="oneliner">${DRIVE[D.top].line}</div></div>
    <div class="card"><h3>副动力：${D.sec}型</h3><p>${DRIVE[D.sec].sub}——特定情境中会被启动的辅助动力。</p></div>
    <div class="card"><h3>耗损警示：${D.low}型</h3><p>这是分数最低的动力模式。长期被要求以此模式运作，容易疲惫或空耗——安排位置时要避开。</p></div>`;
} else document.getElementById('secDrive').classList.add('hidden');
</script>
