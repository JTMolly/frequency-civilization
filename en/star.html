// Front-end only mini game.
// The 12 stars are metaphors for the 12 Root Codes. This is an imagination game, not a test.
const STARS=[
 {k:'SK',n:"Sa'karan",r:'The Architect',c:'#b8892b',land:'A planet of rock strata and pillars of light, where everyone lays down stones one by one to turn imagination into something real.',gift:'Turning chaos into structure',

   {l:'Grab every variable back and stay up all night re-planning',d:{body:-10,calm:-8,gift:+3},m:'The tighter you held the structure, the more your creativity got stuck.'},

 {k:'EL',n:"Elariah",r:'The Empath',c:'#e8806f',land:'A planet wrapped in a warm ocean, where every ripple is a feeling.',gift:'Sensing what others leave unsaid',
  kid:'As a kid you could walk into the living room and know right away whether your parents had just been arguing.',

 {k:'TH',n:"Thaleon",r:'The Transformer',c:'#5b3fa0',land:'A planet of fire auroras, where anything that comes in gets burned into a new shape.',gift:'Turning hurt into strength',

   {l:'Confirm the direction first, then go full speed',d:{gift:+10,bond:+8},m:'From “reacting” to “responding”: your speed carried everyone with you.'},
   {l:'Sulk and do nothing',d:{calm:-10,gift:-4},m:'The fire wasn’t out. It was just smoldering inside.'}]},key:'Confirm the direction first, then go full speed.'},
 {k:'ZA',n:"Zae'rah",r:'The Stabilizer',c:'#3fa98f',land:'A quiet lake planet with still water, where even the stars are perfectly clear.',gift:'Helping the people around you feel at ease',
  kid:'As a kid you were the quietest one at home, the one adults never had to worry about.',

 {k:'VA',n:"Valtara",r:'The Integrator',c:'#2a46b8',land:'A planet of hexagonal cities woven into a network, where every node connects to every other.',gift:'Connecting everyone together',

  kid:'As a kid you kept a diary, collected things, and remembered everyone’s birthday.',

 {k:'XO',n:"Xon'teh",r:'The Connector',c:'#1f5fbf',land:'A planet full of workshops, where any two things can find a way to connect.',gift:'Turning ideas into tools',

   {l:'Go back and ask the people who use it, and let the tool serve them',d:{gift:+10,bond:+10},m:'From “controlling” to “collaborating”: efficiency can have warmth too.'},
   {l:'Add ten more features',d:{body:-10,gift:-2},m:'It got more complicated, and you got more tired.'}]},key:'Tools serve people, and efficiency can have warmth.'},
 {k:'NA',n:"Nael'tu",r:'The Navigator',c:'#6a62c4',land:'A planet closest to the North Star, where everyone is used to looking up to find their way.',gift:'Seeing paths that don’t exist yet',

   {l:'Carry everything yourself',d:{body:-12,bond:-8,gift:+4},m:'The future you saw was bright, but the more you led, the lonelier you got.'},
   {l:'Say the direction clearly and let everyone remember their own path',d:{bond:+10,gift:+8,calm:+6},m:'From “leading” to “igniting”: people started walking on their own.'},
   {l:'Give up on this direction',d:{gift:-12},m:'The path that didn’t exist yet went back into your imagination.'}]},key:'The best leadership helps everyone remember their own direction.'},
 {k:'OR',n:"Ori'shan",r:'The Rhythm Keeper',c:'#b5357f',land:'A singing planet, where heartbeats, tides and footsteps all keep the same beat.',gift:'Setting the rhythm for everyone',

 [{t:'Childhood',e:s=>`${s.kid} Some adults said that was good, and some said it wasn’t.`,o:[

 [{t:'Relationships',e:()=>'You meet someone who understands you very well, and someone who needs you very much.',o:[

 ['⁴ Chronic insomnia prevalence about 11.3% (roughly 1 in 10): Taiwan Society of Sleep Medicine survey, reported by CommonHealth on 24 Mar 2017 (Chinese-language source)','https://www.commonhealth.com.tw/article/74559'],
];
function buildStages(s){return POOL.map(p=>p==='TRIAL'?{t:'Planet Trial',e:()=>s.trial.e,o:s.trial.o}:rnd(p));}
function ending(st){
  const {body,calm,bond,gift}=st;
  if(gift>=70&&body>=55&&calm>=55) return ['Steady Glow','You lived out your gift without burning yourself out.','glow'];
  if(gift>=70&&body<45) return ['Burning Too Fast','Your light is bright, but your body has been paying the bill.','burn'];
  if(bond>=70&&gift<55) return ['Lighting Up Others','You cared for so many people. Next time, remember to care for yourself too.','light'];
  if(calm>=70) return ['Quietly Rooted','You’re steady, and the people around you feel at ease because of you.','root'];
  if(gift<40) return ['Gift Kept Hidden','The light of that star is still there. It just hasn’t been brought out to use.','hide'];
  return ['Still on the Road','You’re feeling your way forward, and that’s a kind of courage too.','road'];
}
let S={};
// Feedback and player voices: anonymous; only a button choice and an optional message are stored; messages show only after approval.
const SB_URL='https://ssqozzkhkqxdbqmqamee.supabase.co',SB_KEY='sb_publishable_3QsVK0QyO9SWOPTo84QZzQ_EDVaNagP';
const FB_LOCAL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const FB_CHOICES={more_stars:'More planets',more_levels:'More levels',share_card:'Share cards',other:'Other'};
function fbState(){try{return JSON.parse(localStorage.getItem('fc_star_fb')||'{}');}catch(e){return {};}}
function fbSave(st){try{localStorage.setItem('fc_star_fb',JSON.stringify(st));}catch(e){}}
function fbPost(row){
  if(FB_LOCAL){console.info('[Local preview] Not writing to star_feedback',row);return Promise.resolve({ok:true,status:201});}
  return fetch(SB_URL+'/rest/v1/star_feedback',{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(row)});
}
function fbVote(c,btn){
  const st=fbState(); st.votes=st.votes||{};
  if(st.votes[c]){return;}
  btn.disabled=true;
  fbPost({choice:c}).then(r=>{
    if(r.ok||r.status===409){st.votes[c]=Date.now();fbSave(st);btn.classList.add('done');btn.textContent='✓ '+FB_CHOICES[c];}
    else{btn.disabled=false;document.getElementById('fbstatus').textContent='Couldn’t send it right now. Please try again later.';}
  }).catch(()=>{btn.disabled=false;document.getElementById('fbstatus').textContent='The connection seems unstable. Please try again later.';});
}
function fbSend(){
  const box=document.getElementById('fbmsg'),out=document.getElementById('fbstatus'),btn=document.getElementById('fbsend');
  if(document.getElementById('fbhp').value){out.textContent='Thank you, we got it.';return;}
  const msg=box.value.trim();
  if(!msg){out.textContent='Nothing written yet.';return;}
  if([...msg].length>200){out.textContent='Please keep it within 200 characters.';return;}
  if(/[\w.+-]+@[\w-]+\.[\w.]+|https?:\/\/|www\.|\+?\d[\d\s-]{7,}/i.test(msg)){out.textContent='That looks like contact details or a link. Please remove it before sending.';return;}
  const st=fbState(); const now=Date.now(); st.msgs=(st.msgs||[]).filter(t=>now-t<864e5);
  if(st.msgs.length>=3){out.textContent='We already received your messages today. Come back tomorrow.';return;}
  if(st.msgs.length&&now-st.msgs[st.msgs.length-1]<20000){out.textContent='Take it easy, wait a moment before sending again.';return;}
  btn.disabled=true;out.textContent='Sending…';
  fbPost({choice:'other',message:msg}).then(r=>{
    if(r.ok||r.status===409){st.msgs.push(now);fbSave(st);box.value='';out.textContent='Got it, thank you. Messages are shown publicly only after review.';}
    else{out.textContent='Couldn’t send it right now. Please try again later.';}
    btn.disabled=false;
  }).catch(()=>{out.textContent='The connection seems unstable. Please try again later.';btn.disabled=false;});
}
function loadVoices(){
  fetch(SB_URL+'/rest/v1/star_feedback?select=message&approved=eq.true&message=not.is.null&order=created_at.desc&limit=5',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
    .then(r=>r.ok?r.json():[]).then(rows=>{
      const isEn=PAGE_LANG==='en';rows=(rows||[]).filter(r=>/[\u3400-\u9fff]/.test(r.message)!==isEn);
      const box=document.getElementById('voices'); if(!box||!rows||!rows.length)return;
      const h=document.createElement('b'); h.textContent='Players say'; box.appendChild(h);
      rows.forEach(r=>{const d=document.createElement('div');d.className='voice';d.textContent=r.message;box.appendChild(d);});
      box.className='card';
    }).catch(()=>{});
}
const PAGE_LANG=document.documentElement.lang||'zh-Hant';
function ev(name,params){try{if(window.gtag)gtag('event',name,Object.assign({transport_type:'beacon',lang:PAGE_LANG},params||{}));}catch(e){}}
function start(){
  const star=rnd(STARS); const home=rnd(HOMES);
  S={star,home,i:0,stages:buildStages(star),stat:{body:60+Math.floor(Math.random()*15),calm:45+Math.floor(Math.random()*15),bond:45+Math.floor(Math.random()*15),gift:45+Math.floor(Math.random()*15)},log:[]};
  S.peers=[0,1,2,3].map(()=>({home:rnd(HOMES),stat:{...S.stat}}));
  ev('game_start');
  render();
}
function choose(k){
  const st=S.stages[S.i]; const o=st.o[k];
  for(const [a,v] of Object.entries(o.d)) S.stat[a]=clamp(S.stat[a]+v);
  S.log.push(`${st.t}: ${o.l}. ${o.m}`);
  // The four others born in the same second choose at random.
  S.peers.forEach(p=>{const q=rnd(st.o); for(const [a,v] of Object.entries(q.d)) p.stat[a]=clamp(p.stat[a]+v);});
  S.i++;
  if(S.i===S.stages.length) ev('game_end',{star:S.star.k,ending:ending(S.stat)[2]});
  render(o.m);
}
function bars(stat){return '<div class="bars">'+Object.entries(STAT_NAMES).map(([k,n])=>`<span>${n}</span><span class="bar"><i style="width:${stat[k]}%"></i></span><span>${stat[k]}</span>`).join('')+'</div>';}
function render(msg){
  const app=document.getElementById('app');
  if(!S.star){
    app.innerHTML=`<div class="center"><div class="small">Frequency Civilization | Mini game</div><h1>Which Star Do You Set Out From?</h1>
    <p>There are 8 billion people on Earth.<br>Imagine that before each of us set out, we all came from a star.</p>
    <p class="small">Worldwide, about 4 babies are born every second.⁰<br>So on this trip, you’ll see the 4 other people who set out in the same second as you.</p>
    <p class="small">You can’t choose which star you set out from, or what kind of family you’re born into.<br>But once you’re on Earth, every step is yours to choose.</p>
    <button class="main" onclick="start()">Set out</button></div>
    <p class="note">This is an imagination game. The 12 stars are metaphors for 12 kinds of gifts. It is not a test and not a prediction.</p>`;
    return;
  }
  const s=S.star;
  if(S.i<S.stages.length){
    const st=S.stages[S.i];
    app.innerHTML=`<div class="card center" style="--glow:${s.c}55"><div class="star" style="background:radial-gradient(circle at 35% 35%,#fff,${s.c})"></div>
      <div><b>${s.n}</b> · ${s.r}</div><div class="small">${S.i===0?s.land+'<br>Your starting point on Earth: '+S.home+'. ':'Gift: '+s.gift}</div></div>
      <div class="card"><div class="stage">${st.t} | ${S.i+1} / ${S.stages.length}</div><div class="event">${st.e(s)}</div>${FACTS[st.t]?`<div class="fact">Did you know? ${FACTS[st.t]}</div>`:''}
      ${st.o.map((o,k)=>`<button onclick="choose(${k})">${o.l}</button>`).join('')}
      ${msg?`<div class="log">${msg}</div>`:''}</div>
      <div class="card">${bars(S.stat)}</div>`;
    return;
  }
  const [title,line]=ending(S.stat);
  app.innerHTML=`<div class="card center" style="--glow:${s.c}66"><div class="small">The journey is complete</div>
    <div class="star" style="background:radial-gradient(circle at 35% 35%,#fff,${s.c})"></div>
    <h1>${title}</h1><p>You set out from <b>${s.n}</b> (${s.r}).<br>${line}</p>${bars(S.stat)}<p class="small">${s.n}’s reminder: ${s.key}</p></div>
    <div class="card"><b>The other four people who set out from the same star in the same second</b><div class="peers">
    ${S.peers.map((p,i)=>{const [t]=ending(p.stat);return `<div><span class="dot" style="background:${s.c}"></span>Person ${i+1}, born into ${p.home}: ${t}</div>`}).join('')}
    </div><p class="small">Same star, same gift, different choices.</p></div>
    <div class="card"><b>Your choices on this trip</b>${S.log.map(l=>`<div class="log">${l}</div>`).join('')}</div>
    <div class="card center"><p>Any message can be a reference,<br>but the decision about your life is yours alone.</p>
    <button onclick="S={};render()">Play again</button>
    <a href="tests.html" target="_blank" rel="noopener" onclick="ev(\'click_test\')"><button class="main">Want to meet the real you? Take the Root Code Test</button></a></div>
    <div class="card" id="fb"><b>What would you like to see in this game?</b>
      <div class="fbrow">${Object.entries(FB_CHOICES).map(([k,t])=>`<button class="fbtn${(fbState().votes||{})[k]?' done':''}" ${(fbState().votes||{})[k]?'disabled':''} onclick="fbVote('${k}',this)">${(fbState().votes||{})[k]?'✓ ':''}${t}</button>`).join('')}</div>
      <textarea id="fbmsg" rows="3" maxlength="200" placeholder="Anything you’d like to tell us? (optional, up to 200 characters)"></textarea>
      <input id="fbhp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" placeholder="Please leave blank">
      <div class="small">Please don’t leave your name, phone number or other personal details. Messages are shown publicly only after review.</div>
      <button id="fbsend" onclick="fbSend()">Send message</button><span id="fbstatus" class="fbmsg"></span></div>
    <div id="voices"></div>
    <div class="src"><b>Data sources</b>${SOURCES.map(([t,u])=>`<div><a href='${u}' target="_blank" rel="noopener">${t}</a></div>`).join('')}</div>`;
  loadVoices();
}
render();
</script>
